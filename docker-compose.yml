services:
  mongodb:
    image: mongo:7
    container_name: meecargo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - meecargo_mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
        try {
          rs.status().ok
        } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok
        }"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meecargo_mongo_data:
